services:
  - type: web
    name: debugtrack
    runtime: node
    plan: free
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm run start:deploy
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
